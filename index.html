<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلسلة 20 تمريناً تفاعلياً - الرابعة متوسط - الأستاذ يوسفي السوفي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #eff6ff;
            --secondary: #0f766e;
            --accent: #d97706;
            --success: #15803d;
            --success-bg: #dcfce7;
            --warning: #b45309;
            --warning-bg: #fef3c7;
            --danger: #b91c1c;
            --danger-bg: #fee2e2;
            --dark: #0f172a;
            --bg: #f1f5f9;
            --card: #ffffff;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--dark); line-height: 1.75; padding-bottom: 70px; }

        /* الترويسة الرسمية */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #0f766e 100%);
            color: white;
            padding: 28px 20px;
            text-align: center;
            border-bottom: 5px solid #fbbf24;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        header h4 { font-size: 1rem; font-weight: 500; opacity: 0.95; margin-bottom: 4px; }
        header h2 { font-size: 1.25rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
        header h1 { font-size: 1.7rem; font-weight: 800; color: #fef08a; margin: 8px 0; }
        header .prof-badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            border: 1px solid #fbbf24;
            padding: 5px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.05rem;
            margin-top: 6px;
            color: #ffffff;
        }

        /* شريط النقاط والتبويب */
        .sticky-top {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(8px);
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            border-bottom: 1px solid var(--border);
            padding: 10px 15px;
        }
        .sticky-inner {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .score-pill {
            background: var(--primary);
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.15rem;
        }
        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            color: #334155;
            transition: all 0.2s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: var(--secondary);
            color: white;
        }

        .container { max-width: 960px; margin: 24px auto 0 auto; padding: 0 15px; }

        /* بطاقة التمرين */
        .ex-card {
            background: var(--card);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .ex-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-light);
            padding: 10px 16px;
            border-radius: 10px;
            border-right: 5px solid var(--primary);
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .ex-card-header h3 { font-size: 1.2rem; color: var(--primary); font-weight: 800; }
        .cat-tag {
            font-size: 0.82rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 15px;
            background: white;
            color: var(--secondary);
            border: 1px solid #99f6e4;
        }

        .ex-context {
            background: #f8fafc;
            border: 1px dashed #94a3b8;
            padding: 13px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 1.03rem;
        }

        .math {
            direction: ltr;
            display: inline-block;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            background: #e2e8f0;
            padding: 1px 7px;
            border-radius: 5px;
            margin: 0 2px;
            color: #0f172a;
        }

        /* كتلة السؤال */
        .q-block {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 14px;
            background: #ffffff;
            transition: all 0.2s;
        }
        .q-block.solved { border-color: #86efac; background: #f0fdf4; }
        .q-block.failed { border-color: #fca5a5; background: #fef2f2; }

        .q-title {
            font-weight: 800;
            font-size: 1.04rem;
            color: #1e293b;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        .att-badge {
            font-size: 0.78rem;
            color: #475569;
            background: #f1f5f9;
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
            font-weight: 700;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        input[type="text"], select {
            padding: 9px 13px;
            border: 2px solid #cbd5e1;
            border-radius: 9px;
            font-size: 1rem;
            font-weight: 700;
            min-width: 210px;
            outline: none;
            direction: ltr;
            text-align: center;
        }
        select { direction: rtl; text-align: right; }
        input:focus, select:focus { border-color: var(--primary); }

        .sym-btn {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            padding: 7px 11px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .sym-btn:hover { background: #cbd5e1; }

        .btn-verify {
            background: var(--primary);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 0.96rem;
            cursor: pointer;
        }
        .btn-verify:hover { background: #1d4ed8; }
        .btn-verify:disabled { background: #94a3b8; cursor: not-allowed; }

        .fb-box {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.94rem;
            display: none;
        }
        .fb-box.success { display: block; background: var(--success-bg); color: var(--success); border-right: 4px solid var(--success); }
        .fb-box.hint { display: block; background: var(--warning-bg); color: var(--warning); border-right: 4px solid var(--warning); }
        .fb-box.fail { display: block; background: var(--danger-bg); color: var(--danger); border-right: 4px solid var(--danger); }

        .sol-box {
            margin-top: 12px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-right: 4px solid var(--secondary);
            padding: 13px;
            border-radius: 9px;
            display: none;
            font-size: 0.95rem;
        }
        .sol-box h4 { color: var(--secondary); margin-bottom: 6px; font-size: 1rem; }

        @media (max-width: 600px) {
            .input-row { flex-direction: column; align-items: stretch; }
            input[type="text"], select, .btn-verify { width: 100%; }
            .sticky-inner { flex-direction: column; align-items: stretch; text-align: center; }
            .filter-tabs { justify-content: center; }
        }
    </style>
</head>

                            <div class="sol-box" id="sol-${q.qId}">
                                <h4>✔ الحل النموذجي المفصل والشرح:</h4>
                                <div>${q.sol}</div>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="ex-card-header">
                        <h3>${ex.title}</h3>
                        <span class="cat-tag">${ex.catName}</span>
                    </div>
                    <div class="ex-context">${ex.context}</div>
                    ${qHtml}
                `;
                container.appendChild(card);
            });
        }

        function insertChar(inputId, ch) {
            const el = document.getElementById(inputId);
            if (!el || el.disabled) return;
            el.value += ch;
            el.focus();
        }

        function normalize(str) {
            if (!str) return '';
            const ar = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            let s = str.toString().trim();
            for (let i = 0; i < 10; i++) s = s.replace(new RegExp(ar[i], 'g'), i);
            s = s.replace(/\s+/g, '')
                 .replace(/،/g, ';')
                 .replace(/و/g, ';')
                 .replace(/جذر/g, '√')
                 .replace(/على/g, '/');
            return s;
        }

        function updateGlobalScore(qId, newPts, lockQuestion) {
            const prev = earned[qId] || 0;
            if (newPts > prev) {
                totalScore += (newPts - prev);
                earned[qId] = newPts;
                document.getElementById('globalScore').innerText = `${totalScore} / 100`;
            }
            if (lockQuestion) {
                document.getElementById(`block-${qId}`).classList.add('solved');
                document.getElementById(`btn-${qId}`).disabled = true;
                document.getElementById(`in-${qId}`).disabled = true;
                document.getElementById(`sol-${qId}`).style.display = 'block';
                if (typeof confetti === 'function') confetti({ particleCount: 45, spread: 60, origin: { y: 0.75 } });
            }
        }

        function checkAnswer(exId, qId) {
            const ex = exercisesData.find(e => e.id == exId);
            const q = ex.questions.find(item => item.qId === qId);
            const rawVal = document.getElementById(`in-${qId}`).value;
            const val = (q.type === 'select') ? rawVal : normalize(rawVal);
            const fb = document.getElementById(`fb-${qId}`);

            if (!val) {
                fb.className = 'fb-box hint';
                fb.innerHTML = '⚠️ يرجى كتابة أو اختيار الإجابة أولاً قبل الضغط على الزر.';
                return;
            }

            // التحقق من الإجابة الكاملة
            const isExact = q.exact.some(ans => normalize(ans).toLowerCase() === val.toLowerCase());
            if (isExact) {
                fb.className = 'fb-box success';
                fb.innerHTML = `🎉 أحسنت! إجابة صحيحة ودقيقة. حصلت على العلامة الكاملة (${q.pts} / ${q.pts}).`;
                updateGlobalScore(qId, q.pts, true);
                return;
            }

            // التحقق من الإجابة الجزئية (دون اختزال أو دون تبسيط)
            const isPartial = q.partial && q.partial.some(ans => normalize(ans).toLowerCase() === val.toLowerCase());
            if (isPartial) {
                const halfPts = Math.round((q.pts / 2) * 100) / 100;
                updateGlobalScore(qId, halfPts, false);
                handleAttemptFail(q, halfPts, q.partMsg);
                return;
            }

            // إجابة خاطئة
            handleAttemptFail(q, 0, null);
        }

        function handleAttemptFail(q, partialAwarded, customMsg) {
            const qId = q.qId;
            attempts[qId]--;
            const rem = attempts[qId];
            document.getElementById(`att-${qId}`).innerText = `المحاولات: ${rem} | (${q.pts} ن)`;
            const fb = document.getElementById(`fb-${qId}`);

            if (rem > 0) {
                const hintText = (rem === 2) ? q.h1 : q.h2;
                fb.className = 'fb-box hint';
                const prefix = customMsg
                    ? `${customMsg} (تم منحك ${partialAwarded} ن مؤقتاً).<br>`
                    : `❌ إجابة غير صحيحة، حاول مرة أخرى.<br>`;
                fb.innerHTML = `${prefix}<strong>${hintText}</strong> (بقي لك ${rem} محاولة)`;
            } else {
                fb.className = 'fb-box fail';
                fb.innerHTML = `⚠️ استنفدت محاولاتك الثلاث في هذا السؤال. إليك الحل النموذجي المفصل مع الشرح الكامل:`;
                document.getElementById(`block-${qId}`).classList.add('failed');
                document.getElementById(`btn-${qId}`).disabled = true;
                document.getElementById(`in-${qId}`).disabled = true;
                document.getElementById(`sol-${qId}`).style.display = 'block';
            }
        }

        function filterEx(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.ex-card').forEach(card => {
                if (cat === 'all' || card.dataset.cat === cat) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        window.onload = renderAll;
    </script>
</body>
</html>
